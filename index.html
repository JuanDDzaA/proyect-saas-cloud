<!DOCTYPE html>
<html>
<head>
<title>SaaS Funcional</title>
<style>
body { margin:0; font-family:Arial; background:#dadbd3; }
#app { display:flex; height:100vh; }

/* SIDEBAR */
#sidebar { width:30%; background:#111b21; color:white; display:flex; flex-direction:column; }
#usuario-header { padding:15px; background:#202c33; font-weight:bold; }
#nav-botones { display:flex; gap:5px; padding:10px; background:#111b21; justify-content:center;}
#nav-botones button { background:#202c33; border-radius:5px; margin:0; }
#usuarios { flex:1; overflow-y:auto; }
.usuario { padding:15px; border-bottom:1px solid #2a3942; cursor:pointer; }
.usuario:hover { background:#2a3942; }
.activo { background:#2a3942; }

/* SECCIONES (Chat, Tickets, Tareas) */
.seccion { flex:1; display:none; flex-direction:column; background:#efeae2; }
.seccion.visible { display:flex; }
.header-seccion { background:#202c33; color:white; padding:15px; font-weight:bold; }
.contenedor-datos { flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.item-saas { background:white; padding:10px; border-radius:10px; border-left: 5px solid #00a884; }

/* MENSAJES */
.mensaje { max-width:60%; padding:10px; border-radius:10px; }
.mio { background:#d9fdd3; align-self:flex-end; }
.otro { background:white; align-self:flex-start; }

/* INPUT */
.input-area { display:flex; padding:10px; background:#202c33; gap:10px;}
.input-area input { flex:1; padding:10px; border-radius:10px; border:none; outline:none; }
button { padding:10px; border:none; background:#00a884; color:white; cursor:pointer; border-radius:20px;}

/* LOGIN */
#login { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:10px; display:flex; flex-direction:column; gap:10px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
<h3>Login</h3>
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
<button onclick="registro()">Registrarse</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<!-- SIDEBAR -->
<div id="sidebar">
  <div id="usuario-header">👤 <span id="usuario"></span></div>
  <div id="nav-botones">
      <button onclick="cambiarPestana('chat-sec')">💬 Chat</button>
      <button onclick="cambiarPestana('tickets-sec')">🎫 Tickets</button>
      <button onclick="cambiarPestana('tareas-sec')">✅ Tareas</button>
  </div>
  <div id="usuarios"></div>
</div>

<!-- CHAT -->
<div id="chat-sec" class="seccion visible">
  <div class="header-seccion" id="chat-header">Selecciona un chat</div>
  <div class="contenedor-datos" id="mensajes"></div>
  <div class="input-area">
    <input id="mensaje" placeholder="Escribe un mensaje">
    <button onclick="enviar()">➤ Enviar</button>
  </div>
</div>

<!-- TICKETS -->
<div id="tickets-sec" class="seccion">
  <div class="header-seccion">Gestión de Tickets</div>
  <div class="contenedor-datos" id="lista-tickets"></div>
  <div class="input-area">
    <input id="nuevo-ticket-titulo" placeholder="Título">
    <input id="nuevo-ticket-desc" placeholder="Descripción">
    <button onclick="enviarTicket()">Crear Ticket</button>
  </div>
</div>

<!-- TAREAS -->
<div id="tareas-sec" class="seccion">
  <div class="header-seccion">Gestión de Tareas</div>
  <div class="contenedor-datos" id="lista-tareas"></div>
  <div class="input-area">
    <input id="nueva-tarea-titulo" placeholder="Título de la tarea">
    <input id="nueva-tarea-asignado" placeholder="Asignar a...">
    <button onclick="enviarTarea()">Asignar Tarea</button>
  </div>
</div>

</div>

<script>
let usuarioActual = "";
let chatActual = null;

// LÓGICA ORIGINAL: LOGIN Y REGISTRO
async function login(){
  const username = user.value;
  const password = pass.value;
  const res = await fetch("/login",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({username, password})
  });
  if(res.ok){
    usuarioActual = username;
    document.getElementById("usuario").innerText = username;
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="flex";
    cargarUsuarios();
    cargarTickets();
    cargarTareas();
  } else alert("Error login");
}

async function registro(){
  const username = user.value;
  const password = pass.value;
  const res = await fetch("/registro",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({username, password})
  });
  if(res.ok) alert("Usuario creado"); else alert("Error");
}

// NAVEGACIÓN SAAS
function cambiarPestana(id) {
    document.querySelectorAll('.seccion').forEach(s => s.classList.remove('visible'));
    document.getElementById(id).classList.add('visible');
}

// LÓGICA ORIGINAL: CHAT
async function cargarUsuarios(){
  const res = await fetch("/usuarios");
  const data = await res.json();
  const cont = document.getElementById("usuarios");
  cont.innerHTML = `<div class="usuario activo" onclick="abrirChat(null,this)">🌍 Chat global</div>`;
  data.forEach(u=>{
    if(u.username !== usuarioActual){
      cont.innerHTML += `<div class="usuario" onclick="abrirChat('${u.username}',this)">👤 ${u.username}</div>`;
    }
  });
}

function abrirChat(usuario, elemento){
  chatActual = usuario;
  cambiarPestana('chat-sec');
  document.querySelectorAll(".usuario").forEach(u=>u.classList.remove("activo"));
  if(elemento) elemento.classList.add("activo");
  document.getElementById("chat-header").innerText = usuario ? "Chat con " + usuario : "Chat global";
  cargarMensajes();
}

async function cargarMensajes(){
  if(document.getElementById('chat-sec').classList.contains('visible') === false) return;
  const res = await fetch("/mensajes/" + usuarioActual);
  const data = await res.json();
  const cont = document.getElementById("mensajes");
  cont.innerHTML="";
  data.forEach(m=>{
    if(chatActual){
      if(!((m.de === usuarioActual && m.para === chatActual) || (m.de === chatActual && m.para === usuarioActual))) return;
    } else {
      if(m.para !== null) return;
    }
    const tipo = m.de === usuarioActual ? "mio" : "otro";
    cont.innerHTML += `<div class="mensaje ${tipo}"><b>${m.de}</b><br>${m.mensaje}</div>`;
  });
}

async function enviar(){
  const mensaje = document.getElementById("mensaje").value;
  await fetch("/mensaje",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ de: usuarioActual, para: chatActual, mensaje })
  });
  document.getElementById("mensaje").value="";
  cargarMensajes();
}

// NUEVA LÓGICA: TICKETS
async function cargarTickets() {
  const res = await fetch("/tickets");
  const data = await res.json();
  const cont = document.getElementById("lista-tickets");
  cont.innerHTML = data.map(t => `
    <div class="item-saas">
      <b>[${t.estado}] ${t.titulo}</b><br>
      ${t.descripcion}<br>
      <small><i>Reportado por: ${t.creadoPor}</i></small>
    </div>
  `).join('');
}

async function enviarTicket() {
  const titulo = document.getElementById("nuevo-ticket-titulo").value;
  const descripcion = document.getElementById("nuevo-ticket-desc").value;
  if(!titulo || !descripcion) return;
  await fetch("/ticket", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ titulo, descripcion, creadoPor: usuarioActual })
  });
  document.getElementById("nuevo-ticket-titulo").value = "";
  document.getElementById("nuevo-ticket-desc").value = "";
  cargarTickets();
}

// NUEVA LÓGICA: TAREAS
async function cargarTareas() {
  const res = await fetch("/tareas");
  const data = await res.json();
  const cont = document.getElementById("lista-tareas");
  cont.innerHTML = data.map(t => `
    <div class="item-saas">
      <b>[${t.estado}] ${t.titulo}</b><br>
      <small><i>Asignado a: ${t.asignadoA}</i></small>
    </div>
  `).join('');
}

async function enviarTarea() {
  const titulo = document.getElementById("nueva-tarea-titulo").value;
  const asignadoA = document.getElementById("nueva-tarea-asignado").value;
  if(!titulo || !asignadoA) return;
  await fetch("/tarea", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ titulo, asignadoA })
  });
  document.getElementById("nueva-tarea-titulo").value = "";
  document.getElementById("nueva-tarea-asignado").value = "";
  cargarTareas();
}

// REFRESH
setInterval(()=>{
  if(usuarioActual) {
      cargarMensajes();
      cargarTickets();
      cargarTareas();
  }
}, 2000);
</script>
</body>
</html>
